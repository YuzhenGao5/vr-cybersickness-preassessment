name: Source checks

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Check public package boundaries and hashes
        run: python scripts/check_release_package.py
      - name: Run data-free source tests
        run: python scripts/run_source_checks.py
