    source:
      - title: "Combating VR sickness through subtle dynamic field-of-view modification"
        authors: "Fernandes and Feiner"
        year: 2016
        doi: "10.1109/3DUI.2016.7460053"
        url: "https://www.cs.columbia.edu/2016/combating-vr-sickness/combating-vr-sickness.pdf"
        access: "author_pdf_search_index; direct_fetch_size_limit"
      - title: "Effects of field of view on presence, enjoyment, memory, and simulator sickness in a virtual environment"
        authors: "Lin, Duh, Parker, Abi-Rached and Furness"
        year: 2002
        doi: "10.1109/VR.2002.996519"
        url: "https://ieeexplore.ieee.org/document/996519"
        access: "publisher_robot_check; bibliographic_index_found; no_original_full_text_verified"
    evidence:
      factor_support: "context_dependent_fov_interventions"
      threshold_support: "no_universal_60_90_100_120_degree_boundary_verified"
      transfer_to_vrnet: false
      limitations: ["experimental FOV settings do not define a universal sickness threshold", "projection FOV is not necessarily perceived display FOV", "v6 horizontal FOV is nearly invariant", "cannot obtain positive/negative classes by a supported cutoff in current matrix"]

