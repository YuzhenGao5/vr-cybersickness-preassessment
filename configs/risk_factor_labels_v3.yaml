    source:
      - title: "The Onset Threshold of Cybersickness in Constant and Accelerating Optical Flow"
        authors: "Kim and Park"
        year: 2020
        doi: "10.3390/app10217808"
        url: "https://www.mdpi.com/2076-3417/10/21/7808"
        access: "publisher_full_text_search_index"
      - title: "Rotational and Translational Velocity and Acceleration Thresholds for the Onset of Cybersickness in Virtual Reality"
        authors: "Terenzi and Zaal"
        year: 2020
        doi: "10.2514/6.2020-0171"
        url: "https://ntrs.nasa.gov/citations/20200000787"
        access: "institutional_original_paper_and_abstract"
    evidence:
      factor_support: "context_dependent_optic_flow_onset"
      threshold_support: "no_transferable_camera_cutoff_verified"
      transfer_to_vrnet: false
      limitations: ["0.7 m/s^2 candidate not validated", "reported means concern controlled particle-field motion", "matrix position scale is not calibrated to metres", "teleport/load discontinuities require segmentation", "one-second aggregation unvalidated"]

  - id: "multi_axis_rotation"
    enabled: false
    status: "needs_validation"
    label_kind: "rule_generated_proxy"
    threshold_value: null
    threshold_unit: "active_axis_count"
    threshold_source: null
    operator: "greater_than_or_equal"
    metric: "concurrent_artificial_rotation_axes"
    aggregation: null
    required_features: [timestamp, camera_orientation, camera_axis_convention, camera_motion_provenance]
    source:
      - title: "Combined pitch and roll and cybersickness in a virtual environment"
        authors: "Bonato, Bubka and Palmisano"
        year: 2009
        doi: "10.3357/asem.2394.2009"
        url: "https://pubmed.ncbi.nlm.nih.gov/19911517/"
        access: "original_publisher_abstract_via_pubmed"
      - title: "Axis rotation and visually induced motion sickness: the role of combined roll, pitch, and yaw motion"
        authors: "Keshavarz and Hecht"
        year: 2011
        doi: "10.3357/asem.3078.2011"
        url: "https://pubmed.ncbi.nlm.nih.gov/22097636/"
        access: "original_publisher_abstract_via_pubmed"
    evidence:
      factor_support: "specific_single_vs_combined_axis_experiments"
      threshold_support: "axis_activation_cutoff_not_verified"
      transfer_to_vrnet: false
      literature_observations:
        - value: 2
          unit: "axes"
          meaning: "experimental dual-axis condition; not an operational axis-activity threshold"
          accepted_as_threshold: false
      limitations: ["5 degree/frame has no verified original support", "frame-based cutoffs vary with sampling rate", "two axes must be concurrent rather than accumulated separately", "Euler conventions and angle wrapping must be audited", "head motion must not be silently treated as artificial rotation"]

  - id: "wide_fov"
    enabled: false
    status: "unusable"
    label_kind: "rule_generated_proxy"
