schema_version: "3.0"
frozen: true
frozen_at_utc: "2026-10-07T13:07:43Z"
review_date_local: "2026-10-08"
review_timezone: "Pacific/Auckland"
review_report: "results/threshold_literature_review.md"
purpose: "Prepare literature-audited clip risk-factor definitions; no training authorization is implied."
label_source: "engine_supervised_candidate_factor"
label_kind: "rule_generated_proxy"
validated_cybersickness_outcome: false
data_percentile: false
unknown_value: "unknown"
binary_values: [0, 1]
allowed_statuses: [usable, needs_validation, unusable]
generation_gate:
  required_status: "usable"
  require_enabled: true
  require_finite_threshold_value: true
  require_feature_units_verified: true
  require_timestamp_alignment_verified: true
  require_scope_match: true
  failure_value: "unknown"
clip:
  duration_sec: 1.0
  time_source: "timestamp"
  interval_convention: "[start_time, end_time)"
  inherit_session_labels: false
  use_session_max_as_clip_label: false
  insufficient_time_coverage_value: "unknown"
  threshold_duration_validation_required: true
  note: "One second is a processing unit, not a literature-validated sickness exposure duration."
input_separation:
  intended_model_input: "RGB video clips; optional depth/flow only after their provenance is frozen"
  label_generation_input: "engine camera/object telemetry aligned to each clip"
  allow_label_generating_numeric_features_as_model_input: false
  allow_ms_rating_as_factor_label: false
metric_constraints:
  position_unit: "source_coordinate_unit"
  position_to_metre_verified: false
  rotation_unit: "degree"
  per_frame_angle_cutoff_allowed: false
  distinguish_artificial_camera_motion_from_tracked_head_motion: true
  fov_convention_required: "horizontal/vertical; per-eye/combined; projection/internal/display"
  object_identity_required: true
  object_count_is_density: false
  flow_resolution_and_frame_interval_required: true
  local_fov_observation: "v6 fov_horizontal_mean is approximately 95.852 degrees and nearly invariant"

labels:
  - id: "fast_camera_rotation"
    enabled: false
    status: "needs_validation"
    label_kind: "rule_generated_proxy"
    threshold_value: null
    threshold_unit: "degree/s"
    threshold_source: null
    operator: "greater_than"
    metric: "artificial_camera_angular_speed"
    aggregation: null
    required_features: [timestamp, camera_orientation, camera_motion_provenance]
    source:
      - title: "Viewpoint Snapping to Reduce Cybersickness in Virtual Reality"
        authors: "Farmani and Teather"
        year: 2018
        doi: "10.20380/GI2018.23"
        url: "https://graphicsinterface.org/wp-content/uploads/gi2018-23.pdf"
        access: "original_full_text"
      - title: "The Onset Threshold of Cybersickness in Constant and Accelerating Optical Flow"
        authors: "Kim and Park"
        year: 2020
        doi: "10.3390/app10217808"
        url: "https://www.mdpi.com/2076-3417/10/21/7808"
        access: "publisher_full_text_search_index"
    evidence:
      factor_support: "context_dependent"
      threshold_support: "no_transferable_cutoff_verified"
      transfer_to_vrnet: false
      literature_observations:
        - value: 25.0
          unit: "degree/s"
          meaning: "snap-turn activation value in a stationary yaw-navigation experiment"
          accepted_as_threshold: false
        - value: 13.0
          unit: "degree/s"
          meaning: "user candidate attributed to ACM 2023; original title/DOI not identified"
          accepted_as_threshold: false
        - value: 52.0
          unit: "degree/s"
          meaning: "user candidate attributed to ACM 2023; original title/DOI not identified"
          accepted_as_threshold: false
      limitations: ["25 degree/s is intervention-specific", "exposure/order confounding", "yaw-specific scope", "VR.net artificial camera versus head motion separation unverified", "one-second aggregation unvalidated"]

  - id: "high_camera_acceleration"
    enabled: false
    status: "unusable"
    label_kind: "rule_generated_proxy"
    threshold_value: null
    threshold_unit: "m/s^2"
    threshold_source: null
    operator: "greater_than"
    metric: "artificial_camera_linear_acceleration"
    aggregation: null
