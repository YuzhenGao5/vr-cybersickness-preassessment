      threshold_support: "no_object_count_150_cutoff_verified"
      transfer_to_vrnet: false
      limitations: ["matrix entry count is not guaranteed distinct visible object count", "raw count is not density", "published density manipulation did not increase VIMS in the cited condition", "camera views and object naming can change measured counts"]

