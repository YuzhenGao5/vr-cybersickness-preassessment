usable_features:
- name: camera_position
  vrnet_source: v_matrix inverse row 3, columns 0:3 under observed serialization
  vrnet_status: 'yes'
  unity_source: World-space Transform of an untracked camera child; parent path rig
    was moved.
  unity_actual_read: true
  unity_adjustable: true
  adjust_method: 修改无头部跟踪相机的父级路径rig位置
  unit: source_coordinate_unit
  unit_verified: false
  three_conditions_verified: true
  metric_equivalence_verified: true
  artificial_locomotion_separated: false
  validated_scope: 仅本机合成Editor场景、普通未跟踪相机；未验证实际XR运行
  reason: 可用范围为已记录的总相机位姿、源坐标单位；未校准米制，未分离用户头动与人工导航。
  evidence:
    vrnet: results/vrnet_feature_probe.json#features.camera_position
    unity: results/unity_feature_probe.json#features.camera_position
- name: camera_rotation
  vrnet_source: v_matrix inverse 3x3 with observed row-vector layout and fixed Z reflection
    removed
  vrnet_status: 'yes'
  unity_source: World-space quaternion; adjustment made to the parent path rig.
  unity_actual_read: true
  unity_adjustable: true
  adjust_method: 修改人工导航父级rig四元数，保留头部跟踪子节点
  unit: quaternion
  unit_verified: true
  three_conditions_verified: true
  metric_equivalence_verified: true
  artificial_locomotion_separated: false
  validated_scope: 仅本机合成Editor场景、普通未跟踪相机；未验证实际XR运行
  reason: 可用范围为总相机姿态四元数；未证明人工导航旋转与头动独立，跨引擎坐标须校准。
  evidence:
    vrnet: results/vrnet_feature_probe.json#features.camera_rotation
    unity: results/unity_feature_probe.json#features.camera_rotation
