evidence_gate_definitions:
  source_verified: Exact candidate numeric/definition verified in a primary source; abstract/index access
    recorded.
  threshold_claim_verified: Primary source measures an onset threshold for stated condition; does not
    imply universality.
  source_scope_match: Current feature definition, reference frame, timestep, statistic, exposure and measurement
    conditions match evidence; currently false for all.
  threshold_unit_verified: Source unit is confirmed, independently of current VR.net meter calibration.
unknown_handling: If any required gate fails, all audit examples for this candidate remain unknown; do
  not emit61negative labels.
